<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Campus Issue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(120deg, #f7f9fc, #e6ecf3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .form-box {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-control, .form-select {
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
        }
        .back-link {
            margin-top: 20px;
            text-align: center;
        }
        .back-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>🛠️ Report a Campus Issue</h2>
        <form method="post" action="/submit_issue" enctype="multipart/form-data">
            <input type="text" name="name" class="form-control" placeholder="Your Name" required>

            <select name="location" class="form-select" required>
                <option disabled selected>Select Location</option>
                <option>Library</option>
                <option>Block A</option>
                <option>Block B</option>
                <option>Cafeteria</option>
                <option>Auditorium</option>
            </select>

            <textarea name="description" class="form-control" rows="3" placeholder="Describe the problem" required></textarea>

            <input type="file" name="image" accept="image/*" class="form-control" required>

            <button type="submit" class="btn btn-danger mt-3">📩 Submit Issue</button>
        </form>
        <div class="back-link">
            <a href="/">⬅️ Back to Home</a>
        </div>
    </div>
</body>
</html>
