<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Issues Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f1f5f9;
            padding: 40px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
        }
        table {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        th {
            background-color: #0d6efd;
            color: white;
            vertical-align: middle;
        }
        td {
            vertical-align: middle;
        }
        img {
            border-radius: 10px;
            max-width: 100px;
            height: auto;
        }
        .form-select {
            width: 150px;
        }
        .btn-update {
            background-color: #28a745;
            color: white;
        }
        .back {
            text-align: center;
            margin-top: 20px;
        }
        .back a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📋 All Reported Campus Issues</h2>
        <table class="table table-bordered table-striped align-middle text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Description</th>
                    <th>Image</th>
                    <th>Status</th>
                    <th>Update</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td>{{ r[0] }}</td>
                    <td>{{ r[1] }}</td>
                    <td>{{ r[2] }}</td>
                    <td>{{ r[3] }}</td>
                    <td><img src="/uploads/{{ r[4] }}" alt="Issue Image"></td>
                    <td>{{ r[5] }}</td>
                    <td>
                        <form action="/update_status/{{ r[0] }}" method="post" class="d-flex justify-content-center align-items-center gap-2">
                            <select name="status" class="form-select">
                                <option {% if r[5] == 'New' %}selected{% endif %}>New</option>
                                <option {% if r[5] == 'In Progress' %}selected{% endif %}>In Progress</option>
                                <option {% if r[5] == 'Resolved' %}selected{% endif %}>Resolved</option>
                            </select>
                            <button type="submit" class="btn btn-update">✔</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="back">
            <a href="/">⬅️ Back to Home</a>
        </div>
    </div>
</body>
</html>
