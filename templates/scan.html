<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(120deg, #f3f4f6, #dfe9f3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: white;
            width: 100%;
            max-width: 400px;
        }
        img {
            display: block;
            margin: 0 auto 20px;
        }
        h2 {
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn {
            width: 100%;
        }
        .nav-links {
            text-align: center;
            margin-top: 20px;
        }
        .nav-links a {
            margin: 0 10px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📸 Smart Attendance</h2>
        <img src="/static/attendance_qr.png" width="200" alt="QR Code">
        <form method="post" action="/mark_attendance">
            <input type="text" name="name" placeholder="Enter your name" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary">Mark Attendance</button>
        </form>
        <div class="nav-links">
            <a href="/view_attendance">📄 View Attendance</a>
            <a href="/report_issue">🛠️ Report Issue</a>
        </div>
    </div>
</body>
</html>
